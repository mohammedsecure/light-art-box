<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معرض قبل وبعد</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #121212;
            color: #e0e0e0;
        }
        /* إخفاء شريط التمرير الأفقي مع الحفاظ على إمكانية التمرير */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="h-screen flex flex-col md:flex-row overflow-hidden bg-[#121212] text-zinc-200">

    <!-- القائمة الجانبية للصور المصغرة (أفقية للموبايل وتتحول لرأسية للكمبيوتر) -->
    <aside class="w-full md:w-64 bg-[#1a1a1a] border-b md:border-b-0 md:border-l border-zinc-800 p-4 shrink-0 z-10">
        <h2 class="text-xs font-bold text-zinc-400 mb-3 hidden md:block">الصور</h2>
        <div id="thumbnails" class="flex md:flex-col gap-3 overflow-x-auto md:overflow-y-auto no-scrollbar">
            <!-- يتم توليد الصور المصغرة بـ JS -->
        </div>
    </aside>

    <!-- منطقة العرض الرئيسية -->
    <main class="flex-1 flex flex-col justify-between items-center p-4 md:p-8 h-full overflow-hidden">
        
        <!-- إطار عرض الصورة -->
        <div class="flex-1 flex items-center justify-center w-full max-w-3xl overflow-hidden my-auto">
            <div class="relative w-full h-full max-h-[70vh] flex items-center justify-center rounded-xl overflow-hidden bg-[#1a1a1a] border border-zinc-800">
                <!-- شارة الحالة الحالية (قبل / بعد) -->
                <span id="stateBadge" class="absolute top-3 right-3 bg-black/70 text-zinc-200 text-xs px-3 py-1 rounded-md border border-zinc-700 z-10 font-bold">
                    بعد
                </span>

                <!-- عنصر الصورة -->
                <img id="mainImage" src="" alt="عرض قبل وبعد" class="max-w-full max-h-full object-contain transition-opacity duration-200" onerror="handleError(this)">
            </div>
        </div>

        <!-- زر التبديل البسيط أسفل الصورة -->
        <div class="w-full max-w-xs pt-4 pb-2">
            <button id="toggleBtn" onclick="toggleState()" class="w-full py-3 px-6 bg-zinc-200 hover:bg-white text-zinc-900 font-bold rounded-xl transition-all active:scale-95 shadow-md">
                عرض صورة "قبل"
            </button>
        </div>

    </main>

    <script>
        // مصفوفة الصور الثلاث بنفس المسميات والمسارات المطلوبة
        const images = [
            { before: 'img/1.webp', after: 'img/1.2.webp' },
            { before: 'img/2.webp', after: 'img/2.2.webp' },
            { before: 'img/3.webp', after: 'img/3.2.webp' }
        ];

        let currentIndex = 0;
        let isAfter = true; // الحالة الافتراضية عند البدء هي "بعد"

        const mainImage = document.getElementById('mainImage');
        const stateBadge = document.getElementById('stateBadge');
        const toggleBtn = document.getElementById('toggleBtn');
        const thumbnailsContainer = document.getElementById('thumbnails');

        // إنشاء القائمة الجانبية المصغرة (تعتمد صورة "بعد")
        function initThumbnails() {
            thumbnailsContainer.innerHTML = '';
            images.forEach((item, index) => {
                const btn = document.createElement('button');
                btn.className = `shrink-0 rounded-lg overflow-hidden border-2 transition-all w-20 h-16 md:w-full md:h-28 relative bg-[#121212] ${
                    index === currentIndex ? 'border-zinc-200 opacity-100' : 'border-transparent opacity-50 hover:opacity-80'
                }`;
                btn.onclick = () => selectImage(index);

                btn.innerHTML = `
                    <img src="${item.after}" class="w-full h-full object-cover" onerror="handleError(this, 'صورة ${index + 1}')">
                `;
                thumbnailsContainer.appendChild(btn);
            });
        }

        // تحديث الصورة المعروضة على الشاشة
        function updateDisplay() {
            const currentItem = images[currentIndex];
            mainImage.src = isAfter ? currentItem.after : currentItem.before;
            
            if (isAfter) {
                stateBadge.textContent = 'بعد';
                toggleBtn.textContent = 'عرض صورة "قبل"';
            } else {
                stateBadge.textContent = 'قبل';
                toggleBtn.textContent = 'عرض صورة "بعد"';
            }

            initThumbnails();
        }

        // التبديل بين حالة قبل وبعد
        function toggleState() {
            isAfter = !isAfter;
            updateDisplay();
        }

        // اختيار صورة من القائمة الجانبية
        function selectImage(index) {
            currentIndex = index;
            isAfter = true; // إعادة الضبط لعرض "بعد" عند اختيار صورة جديدة
            updateDisplay();
        }

        // صورة توضيحية بسيطة بحال عدم وجود الصور في المجلد المحلي
        function handleError(img, text) {
            const label = text || (isAfter ? `صورة ${currentIndex + 1} (بعد)` : `صورة ${currentIndex + 1} (قبل)`);
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400"><rect width="600" height="400" fill="%23222222"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="24" fill="%23888888">${label}</text></svg>`;
            img.src = `data:image/svg+xml;utf8,${svg}`;
        }

        // بدء التشغيل
        updateDisplay();
    </script>
</body>
</html>
