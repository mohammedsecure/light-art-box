<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>قبل / بعد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0d11;
    --panel:#12151b;
    --panel-2:#171b22;
    --line:#232936;
    --text:#e8ecf2;
    --after:#34d399;
    --before:#fbbf24;
  }

  *,*::before,*::after{ box-sizing:border-box; }

  html,body{ height:100%; }

  body{
    margin:0;
    overflow:hidden;
    font-family:'Cairo', system-ui, -apple-system, "Segoe UI", sans-serif;
    color:var(--text);
    background:
      radial-gradient(900px 600px at 90% -15%, #1a2233 0%, transparent 60%),
      radial-gradient(700px 500px at 0% 110%, #1a1526 0%, transparent 55%),
      var(--bg);
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }

  /* ===== الهيكل ===== */
  .app{
    height:100dvh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    padding:10px;
    gap:10px;
  }

  /* ===== المسرح ===== */
  .stage{
    position:relative;
    flex:1 1 auto;
    min-height:0;
    border-radius:16px;
    overflow:hidden;
    background:linear-gradient(180deg,#141821,#0f1218);
    border:1px solid var(--line);
    touch-action:pan-y;
    isolation:isolate;
    transition:border-color .45s ease, box-shadow .45s ease;
  }

  .stage[data-state="after"]{
    border-color:rgba(52,211,153,.28);
    box-shadow:0 20px 50px -30px rgba(0,0,0,.95);
  }
  .stage[data-state="before"]{
    border-color:rgba(251,191,36,.28);
    box-shadow:0 20px 50px -30px rgba(0,0,0,.95);
  }

  .layer{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    opacity:0;
    pointer-events:none;
    user-select:none;
    transition:opacity .45s cubic-bezier(.4,0,.2,1);
  }
  .stage[data-state="after"]  .layer-after,
  .stage[data-state="before"] .layer-before{ opacity:1; }

  /* شارة الحالة */
  .badge{
    position:absolute;
    top:10px;
    inset-inline-start:10px;
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:4px 10px;
    border-radius:999px;
    font-size:11px;
    font-weight:800;
    background:rgba(10,12,16,.62);
    border:1px solid rgba(255,255,255,.09);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    transition:color .35s ease, border-color .35s ease;
    z-index:2;
  }
  .badge::before{
    content:"";
    width:5px; height:5px;
    border-radius:50%;
    background:currentColor;
    box-shadow:0 0 10px currentColor;
  }
  .stage[data-state="after"]  .badge{ color:var(--after);  border-color:rgba(52,211,153,.35); }
  .stage[data-state="before"] .badge{ color:var(--before); border-color:rgba(251,191,36,.35); }

  /* أسهم التنقل الجانبية */
  .nav-btn{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:38px;
    height:38px;
    display:grid;
    place-items:center;
    border-radius:50%;
    background:rgba(10,12,16,.55);
    border:1px solid rgba(255,255,255,.1);
    color:var(--text);
    cursor:pointer;
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    transition:background .2s ease, transform .15s ease;
    z-index:3;
  }
  .nav-btn:hover{ background:rgba(30,36,46,.85); }
  .nav-btn:active{ transform:translateY(-50%) scale(.92); }

  .nav-prev{ inset-inline-start:10px; }
  .nav-next{ inset-inline-end:10px; }

  /* ===== زر التبديل السفلي ===== */
  .toggle{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    padding:14px;
    border:0;
    border-radius:14px;
    background:linear-gradient(180deg,#f6f8fb,#dde3ec);
    color:#0b0d11;
    cursor:pointer;
    box-shadow:0 10px 24px -14px rgba(255,255,255,.45);
    transition:transform .15s ease, filter .2s ease;
  }
  .toggle:hover{ filter:brightness(1.04); }
  .toggle:active{ transform:scale(.97); }
  .toggle svg{ display:block; }

  @media (prefers-reduced-motion: reduce){
    *{ transition-duration:.01ms !important; animation-duration:.01ms !important; }
  }
</style>
</head>
<body>

<div class="app">

  <!-- المسرح -->
  <div class="stage" id="stage" data-state="before">
    <img class="layer layer-before" id="imgBefore" alt="قبل" draggable="false">
    <img class="layer layer-after"  id="imgAfter"  alt="بعد" draggable="false">
    <span class="badge" id="badge">قبل</span>

    <button class="nav-btn nav-prev" id="prevBtn" type="button" aria-label="السابق">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18l6-6-6-6"/>
      </svg>
    </button>

    <button class="nav-btn nav-next" id="nextBtn" type="button" aria-label="التالي">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </button>
  </div>

  <!-- زر تبديل قبل/بعد -->
  <button class="toggle" id="toggleBtn" type="button" aria-label="تبديل قبل / بعد">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 4v13"/><path d="M4 14l3 3 3-3"/>
      <path d="M17 20V7"/><path d="M14 10l3-3 3 3"/>
    </svg>
  </button>

</div>

<script>
(function () {
  'use strict';

  const IMAGES = [
    { before: 'img/1.webp',   after: 'img/1.2.webp' },
    { before: 'img/2.webp',   after: 'img/2.2.webp' },
    { before: 'img/3.webp',   after: 'img/3.2.webp' },
    { before: 'img/4.webp',   after: 'img/4.2.webp' },
    { before: 'img/5.webp',   after: 'img/5.2.webp' }
  ];

  const stage      = document.getElementById('stage');
  const imgBefore  = document.getElementById('imgBefore');
  const imgAfter   = document.getElementById('imgAfter');
  const badge      = document.getElementById('badge');
  const toggleBtn  = document.getElementById('toggleBtn');
  const prevBtn    = document.getElementById('prevBtn');
  const nextBtn    = document.getElementById('nextBtn');

  let index = 0;
  let showAfter = false; /* تبدأ الواجهة بحالة "قبل" */

  function fallback(img, label) {
    if (img.dataset.fb === '1') return;
    img.dataset.fb = '1';
    const svg =
      '<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600">' +
        '<rect width="800" height="600" fill="#171b22"/>' +
        '<text x="400" y="312" text-anchor="middle" ' +
              'font-family="Cairo, sans-serif" font-size="34" fill="#5b6577">' +
          label +
        '</text>' +
      '</svg>';
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }

  function setSrc(img, src, label) {
    if (img.dataset.src === src) return;
    img.dataset.src = src;
    img.onerror = function () { fallback(img, label); };
    img.src = src;
  }

  function render() {
    const item = IMAGES[index];
    if (!item) return;

    setSrc(imgBefore, item.before, 'صورة ' + (index + 1) + ' — قبل');
    setSrc(imgAfter,  item.after,  'صورة ' + (index + 1) + ' — بعد');

    stage.dataset.state = showAfter ? 'after' : 'before';
    badge.textContent   = showAfter ? 'بعد' : 'قبل';
  }

  function toggle() {
    showAfter = !showAfter;
    render();
  }

  function step(dir) {
    index = (index + dir + IMAGES.length) % IMAGES.length;
    showAfter = false; /* عند الانتقال لصورة جديدة نبدأ بـ "قبل" */
    render();
  }

  toggleBtn.addEventListener('click', toggle);
  prevBtn.addEventListener('click', function () { step(-1); });
  nextBtn.addEventListener('click', function () { step(1); });

  /* نقرة على الصورة = تبديل (مع تجاهل النقرة بعد السحب) */
  let swiped = false;
  stage.addEventListener('click', function (e) {
    if (e.target.closest('.nav-btn')) return;
    if (swiped) { swiped = false; return; }
    toggle();
  });

  /* لوحة المفاتيح */
  document.addEventListener('keydown', function (e) {
    if (e.target.tagName === 'BUTTON') return;
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); toggle(); }
    else if (e.key === 'ArrowLeft')  step(1);
    else if (e.key === 'ArrowRight') step(-1);
  });

  /* السحب باللمس */
  let startX = null;
  stage.addEventListener('pointerdown', function (e) {
    if (e.target.closest('.nav-btn')) return;
    startX = e.clientX;
    swiped = false;
  });
  stage.addEventListener('pointerup', function (e) {
    if (startX === null) return;
    const dx = e.clientX - startX;
    startX = null;
    if (Math.abs(dx) > 60) {
      swiped = true;
      step(dx < 0 ? 1 : -1);
    }
  });
  stage.addEventListener('pointercancel', function () { startX = null; });

  /* تحميل مسبق */
  IMAGES.forEach(function (it) {
    [it.before, it.after].forEach(function (src) {
      const pre = new Image();
      pre.src = src;
    });
  });

  render();
})();
</script>
</body>
</html>
