<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>قبل / بعد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0d11;
    --panel-2:#171b22;
    --line:#232936;
    --text:#e8ecf2;
    --after:#34d399;
    --before:#fbbf24;
  }

  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ height:100%; }

  body{
    margin:0;
    overflow:hidden;
    font-family:'Cairo', system-ui, -apple-system, "Segoe UI", sans-serif;
    color:var(--text);
    background:
      radial-gradient(900px 600px at 90% -15%, #1a2233 0%, transparent 60%),
      radial-gradient(700px 500px at 0% 110%, #1a1526 0%, transparent 55%),
      var(--bg);
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }

  .app{
    height:100dvh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    padding:10px;
    gap:10px;
  }

  /* ===== الشريط العلوي ===== */
  .topbar{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:flex-start;
  }

  .select-wrap{
    position:relative;
    display:inline-flex;
    align-items:center;
    max-width:100%;
  }

  .category-select{
    appearance:none;
    -webkit-appearance:none;
    -moz-appearance:none;
    padding:7px 14px 7px 32px;
    border-radius:10px;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    font:inherit;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    outline:none;
    transition:border-color .2s ease;
    max-width:100%;
  }
  .category-select:hover{ border-color:#313a4a; }
  .category-select:focus-visible{ border-color:var(--after); }

  .select-arrow{
    position:absolute;
    left:10px;
    pointer-events:none;
    color:var(--text);
    opacity:.7;
  }

  /* ===== المسرح ===== */
  .stage{
    position:relative;
    flex:1 1 auto;
    min-height:0;
    border-radius:16px;
    overflow:hidden;
    background:linear-gradient(180deg,#141821,#0f1218);
    border:1px solid var(--line);
    touch-action:pan-y;
    isolation:isolate;
    transition:border-color .45s ease, box-shadow .45s ease;
  }

  .stage[data-state="after"]{
    border-color:rgba(52,211,153,.28);
    box-shadow:0 20px 50px -30px rgba(0,0,0,.95);
  }
  .stage[data-state="before"]{
    border-color:rgba(251,191,36,.28);
    box-shadow:0 20px 50px -30px rgba(0,0,0,.95);
  }

  .layer{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    opacity:0;
    pointer-events:none;
    user-select:none;
    transition:opacity .45s cubic-bezier(.4,0,.2,1);
  }
  .stage[data-state="after"]  .layer-after,
  .stage[data-state="before"] .layer-before{ opacity:1; }

  .badge{
    position:absolute;
    top:10px;
    inset-inline-start:10px;
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:4px 10px;
    border-radius:999px;
    font-size:11px;
    font-weight:800;
    background:rgba(10,12,16,.62);
    border:1px solid rgba(255,255,255,.09);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    transition:color .35s ease, border-color .35s ease;
    z-index:2;
  }
  .badge::before{
    content:"";
    width:5px; height:5px;
    border-radius:50%;
    background:currentColor;
    box-shadow:0 0 10px currentColor;
  }
  .stage[data-state="after"]  .badge{ color:var(--after);  border-color:rgba(52,211,153,.35); }
  .stage[data-state="before"] .badge{ color:var(--before); border-color:rgba(251,191,36,.35); }

  .stage[data-state="empty"] .layer,
  .stage[data-state="empty"] .badge,
  .stage[data-state="empty"] .nav-btn{
    display:none;
  }

  .nav-btn{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:38px;
    height:38px;
    display:grid;
    place-items:center;
    border-radius:50%;
    background:rgba(10,12,16,.55);
    border:1px solid rgba(255,255,255,.1);
    color:var(--text);
    cursor:pointer;
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    transition:background .2s ease, transform .15s ease, opacity .2s ease;
    z-index:3;
  }
  .nav-btn:hover:not(:disabled){ background:rgba(30,36,46,.85); }
  .nav-btn:active:not(:disabled){ transform:translateY(-50%) scale(.92); }
  .nav-btn:disabled{ opacity:.3; cursor:not-allowed; }

  .nav-prev{ inset-inline-start:10px; }
  .nav-next{ inset-inline-end:10px; }

  .toggle{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    padding:14px;
    border:0;
    border-radius:14px;
    background:linear-gradient(180deg,#f6f8fb,#dde3ec);
    color:#0b0d11;
    cursor:pointer;
    box-shadow:0 10px 24px -14px rgba(255,255,255,.45);
    transition:transform .15s ease, filter .2s ease, opacity .2s ease;
  }
  .toggle:hover:not(:disabled){ filter:brightness(1.04); }
  .toggle:active:not(:disabled){ transform:scale(.97); }
  .toggle:disabled{ opacity:.3; cursor:not-allowed; }
  .toggle svg{ display:block; }

  @media (prefers-reduced-motion: reduce){
    *{ transition-duration:.01ms !important; animation-duration:.01ms !important; }
  }
</style>
</head>
<body>

<div class="app">

  <header class="topbar">
    <div class="select-wrap">
      <select id="categorySelect" class="category-select" aria-label="التصنيف"></select>
      <svg class="select-arrow" width="12" height="12" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 9l6 6 6-6"/>
      </svg>
    </div>
  </header>

  <div class="stage" id="stage" data-state="empty">
    <img class="layer layer-before" id="imgBefore" alt="قبل" draggable="false">
    <img class="layer layer-after"  id="imgAfter"  alt="بعد" draggable="false">
    <span class="badge" id="badge">قبل</span>

    <button class="nav-btn nav-prev" id="prevBtn" type="button" aria-label="السابق">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18l6-6-6-6"/>
      </svg>
    </button>

    <button class="nav-btn nav-next" id="nextBtn" type="button" aria-label="التالي">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </button>
  </div>

  <button class="toggle" id="toggleBtn" type="button" aria-label="تبديل قبل / بعد">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 4v13"/><path d="M4 14l3 3 3-3"/>
      <path d="M17 20V7"/><path d="M14 10l3-3 3 3"/>
    </svg>
  </button>

</div>

<script>
(function () {
  'use strict';

  /* ══════════════════════════════════════════════════════════
     ⬇⬇⬇  عدّل هذا الجزء فقط عند إضافة أو حذف مجلد  ⬇⬇⬇

     بنية المجلدات المتوقعة (بجانب index.html):

       تحفيزي/
         1.webp  ← قبل
         2.webp  ← بعد
         3.webp  ← قبل
         4.webp  ← بعد
         ...
       ديني/
         1.webp  ← قبل
         2.webp  ← بعد
         ...
       (وهكذا لكل مجلد)

     داخل كل مجلد: الفردي = "قبل"، الذي يليه = "بعد".
     ══════════════════════════════════════════════════════════ */

  const CATEGORIES = [
    'تحفيزي',
    'ديني',
    'أمومة وأطفال',
    'تخرج جامعة',
    'أنمي',
    'جمل مشهورة',
    'منوعات'
  ];

  const IMAGE_EXT = 'webp';   // غيّرها إلى 'jpg' أو 'png' إن لزم

  /* ══════════════════════════════════════════════════════════ */

  const MAX_PAIRS_PER_CATEGORY = 500; // حد أمان ضد الحلقة اللانهائية

  function getImagePath(folder, n) {
    return encodeURIComponent(folder) + '/' + n + '.' + IMAGE_EXT;
  }

  /* ============ عناصر DOM ============ */
  const stage          = document.getElementById('stage');
  const imgBefore      = document.getElementById('imgBefore');
  const imgAfter       = document.getElementById('imgAfter');
  const badge          = document.getElementById('badge');
  const prevBtn        = document.getElementById('prevBtn');
  const nextBtn        = document.getElementById('nextBtn');
  const toggleBtn      = document.getElementById('toggleBtn');
  const categorySelect = document.getElementById('categorySelect');

  /* ============ الحالة ============ */
  let pairs     = [];
  let pairIndex = 0;
  let showAfter = false;
  let scanToken = 0;

  /* ============ أدوات ============ */
  function testImage(src, timeout) {
    timeout = timeout || 5000;
    return new Promise(function (resolve) {
      const img = new Image();
      let done = false;
      function finish(ok) {
        if (done) return;
        done = true;
        clearTimeout(timer);
        resolve(ok);
      }
      const timer = setTimeout(function () { finish(false); }, timeout);
      img.onload  = function () { finish(true);  };
      img.onerror = function () { finish(false); };
      img.src = src;
    });
  }

  /* ============ العرض ============ */
  function renderImage() {
    if (pairs.length === 0) {
      stage.dataset.state = 'empty';
      return;
    }
    const p = pairs[pairIndex];
    if (imgBefore.getAttribute('src') !== p.before) imgBefore.src = p.before;
    if (imgAfter.getAttribute('src')  !== p.after)  imgAfter.src  = p.after;
    stage.dataset.state = showAfter ? 'after' : 'before';
    badge.textContent   = showAfter ? 'بعد' : 'قبل';
  }

  function updateControls() {
    const has = pairs.length > 0;
    prevBtn.disabled   = !has || pairIndex === 0;
    nextBtn.disabled   = !has || pairIndex === pairs.length - 1;
    toggleBtn.disabled = !has;
  }

  function render() {
    renderImage();
    updateControls();
  }

  /* ============ فحص التصنيف ============ */
  async function scanCategory(catIndex) {
    const myToken = ++scanToken;

    pairs     = [];
    pairIndex = 0;
    showAfter = false;
    render();

    const folder = CATEGORIES[catIndex];
    let n = 1;

    while (pairs.length < MAX_PAIRS_PER_CATEGORY) {
      if (myToken !== scanToken) return;

      const before = getImagePath(folder, n);
      const after  = getImagePath(folder, n + 1);
      const res = await Promise.all([testImage(before), testImage(after)]);

      if (myToken !== scanToken) return;
      if (!res[0] || !res[1]) break;

      pairs.push({ before: before, after: after });
      if (pairs.length === 1) render();
      else updateControls();

      n += 2;
    }

    if (myToken !== scanToken) return;
    updateControls();
  }

  /* ============ الأفعال ============ */
  function toggle() {
    if (pairs.length === 0) return;
    showAfter = !showAfter;
    renderImage();
  }

  function step(dir) {
    if (pairs.length === 0) return;
    const i = pairIndex + dir;
    if (i < 0 || i >= pairs.length) return;
    pairIndex = i;
    showAfter = false;
    render();
  }

  /* ============ الأحداث ============ */
  toggleBtn.addEventListener('click', toggle);
  prevBtn.addEventListener('click', function () { step(-1); });
  nextBtn.addEventListener('click', function () { step(1); });

  categorySelect.addEventListener('change', function (e) {
    scanCategory(parseInt(e.target.value, 10));
  });

  let swiped = false;
  stage.addEventListener('click', function (e) {
    if (e.target.closest('.nav-btn')) return;
    if (swiped) { swiped = false; return; }
    toggle();
  });

  document.addEventListener('keydown', function (e) {
    const tag = (e.target && e.target.tagName) || '';
    if (tag === 'BUTTON' || tag === 'SELECT') return;
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); toggle(); }
    else if (e.key === 'ArrowLeft')  step(1);
    else if (e.key === 'ArrowRight') step(-1);
  });

  let startX = null;
  stage.addEventListener('pointerdown', function (e) {
    if (e.target.closest('.nav-btn')) return;
    startX = e.clientX;
    swiped = false;
  });
  stage.addEventListener('pointerup', function (e) {
    if (startX === null) return;
    const dx = e.clientX - startX;
    startX = null;
    if (Math.abs(dx) > 60) {
      swiped = true;
      step(dx < 0 ? 1 : -1);
    }
  });
  stage.addEventListener('pointercancel', function () { startX = null; });

  /* ============ الإقلاع ============ */
  CATEGORIES.forEach(function (name, i) {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = name;
    categorySelect.appendChild(opt);
  });

  scanCategory(0);
})();
</script>
</body>
</html>
